# Minimal install: ingestion, findability replay, residual steps, scaffold diversity (no planner, no precedent support).
name: synspeq-core
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.9
  - rdkit
  - pandas
  - pyyaml
  - pyarrow
  - pip
  - pip:
      - -e .                    # run from the repository root (the clone)
