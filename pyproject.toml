[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "synspeq"
version = "0.1.0.dev0"
description = "SYNSPEQ: SYNthesizability through Standardised Planner Evaluation and Quantification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["rdkit", "pyyaml", "pandas"]

[project.optional-dependencies]
planner = ["aizynthfinder"]
support = ["rxn-insight"]

[project.scripts]
synspeq = "synspeq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synspeq = ["data/*.yaml"]
