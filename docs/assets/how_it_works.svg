  <title>SYNSPEQ pipeline</title>
  <desc>Molecules are ingested, reduced to distinct molecules, planned with AiZynthFinder and saved as routes. Each molecule is purchasable, routed or without a route. Four measures, findability, precedent support, residual steps and scaffold diversity, are written to a report.</desc>
